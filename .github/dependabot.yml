version: 2
updates:
  # Zero runtime dependencies, so every alert here is about the build and the
  # test suite. That does not make them harmless: a compromised devDependency
  # runs on CI with a publish token in scope.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine bumps; anything major still arrives on its own.
      dev-minor-and-patch:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: maven
    directory: /packages/maven-plugin
    schedule:
      interval: monthly

  - package-ecosystem: gradle
    directory: /packages/gradle-plugin
    schedule:
      interval: monthly
