name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Lint (once, Ubuntu/Node 20) ──────────────────────────────────────────────
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: chmod +x bin/*.js scripts/*.cjs
      - name: Typecheck
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check

  # ── Cross-platform test matrix ───────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }} / Node ${{ matrix.node }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci
      - name: Ensure executable permissions
        if: runner.os != 'Windows'
        run: chmod +x bin/*.js scripts/*.cjs

      - name: Build TypeScript
        run: npm run build

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Run E2E tests
        run: node --test dist/tests/cli.test.js

      - name: Run BDD tests
        run: npm run test:bdd

      - name: Run VS Code extension unit tests
        run: npm run test:vscode-unit

      - name: Run MCP server unit tests
        run: npm run test:mcp-unit

      - name: Run pack-registry unit tests
        run: npm run test:registry-unit

      - name: Build pack registry
        run: npm run registry:build

      - name: Run snapshot / determinism tests
        run: npm run test:snapshot

  # ── Maven plugin (Java 11+, no Node needed at runtime) ───────────────────────
  maven-plugin:
    name: Maven plugin
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build csda-maven-plugin
        run: mvn -B -q package
        working-directory: packages/maven-plugin

  # ── Package validation (Ubuntu/Node 20) ──────────────────────────────────────
  package:
    name: Package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: chmod +x bin/*.js scripts/*.cjs
      - name: Build TypeScript
        run: npm run build
      - name: Validate npm package contents
        run: npm run pack:dry-run
      - name: Smoke test from packed tarball
        run: |
          TARBALL="$(npm pack | tail -n 1)"
          npx --yes "./${TARBALL}" --help
          rm -f "${TARBALL}"
