schema_version: "1.3.0"
metadata:
  name: "Search Backend Domain Pack"
  version: "0.1.0"
  language: "en"
  project_type: "backend"

variables:
  required:
    - PROJECT_NAME
    - PROJECT_SLUG
    - DOMAIN

requirements:
  - id: REQ-001
    title: "Index documents on create and update events"
    priority: Must
    description: "Keep the search index in sync with the source of truth."
    status: Draft
  - id: REQ-002
    title: "Execute a full-text query and return ranked results"
    priority: Must
    description: "Return the most relevant documents within a configurable latency budget."
    status: Draft
  - id: REQ-003
    title: "Filter and facet results by structured fields"
    priority: Should
    description: "Users need to narrow results without re-querying with new keywords."
    status: Draft
  - id: REQ-004
    title: "Reindex an existing dataset on demand"
    priority: Should
    description: "Recover from index corruption or schema migrations."
    status: Draft

bounded_contexts:
  - id: BC-001
    name: Indexing
    type: Core
    responsibility: "Apply create/update/delete events to the search index"
    aggregates:
      - SearchIndex
  - id: BC-002
    name: Querying
    type: Core
    responsibility: "Translate user queries to engine queries and rank results"
    aggregates:
      - SearchQuery

use_cases:
  - id: UC-001
    name: Index Document
    actor: System
    requirement: REQ-001
    command: IndexDocumentCommand
  - id: UC-002
    name: Execute Search
    actor: User
    requirement: REQ-002
    command: ExecuteSearchCommand
  - id: UC-003
    name: Apply Filters
    actor: User
    requirement: REQ-003
    command: ApplyFiltersCommand
  - id: UC-004
    name: Reindex Dataset
    actor: Admin
    requirement: REQ-004
    command: ReindexDatasetCommand

commands:
  - id: CMD-001
    name: IndexDocumentCommand
    use_case: UC-001
  - id: CMD-002
    name: ExecuteSearchCommand
    use_case: UC-002
  - id: CMD-003
    name: ApplyFiltersCommand
    use_case: UC-003
  - id: CMD-004
    name: ReindexDatasetCommand
    use_case: UC-004

aggregates:
  - id: AGG-001
    name: SearchIndex
    bounded_context: BC-001
    responsibilities:
      - "Index schema, field mappings, document lifecycle"
    commands:
      - IndexDocumentCommand
      - ReindexDatasetCommand
    events:
      - DocumentIndexed
      - ReindexCompleted
  - id: AGG-002
    name: SearchQuery
    bounded_context: BC-002
    responsibilities:
      - "Parse user query, rank results, return facets"
    commands:
      - ExecuteSearchCommand
      - ApplyFiltersCommand
    events:
      - SearchExecuted

events:
  - id: EVT-001
    name: DocumentIndexed
    aggregate: SearchIndex
    payload:
      - documentId: string
      - indexName: string
      - indexedAt: datetime
  - id: EVT-002
    name: ReindexCompleted
    aggregate: SearchIndex
    payload:
      - indexName: string
      - documentCount: int
      - completedAt: datetime
  - id: EVT-003
    name: SearchExecuted
    aggregate: SearchQuery
    payload:
      - queryId: string
      - userId: string
      - termCount: int
      - resultCount: int
      - latencyMs: int
      - executedAt: datetime

outputs:
  files:
    - target: "docs/specs/capabilities/search.md"
      template: "templates/capability.md.tpl"

business_rules:
  - id: RUL-001
    title: "Indexing failures are retried with exponential backoff"
    context: BC-001
    description: "Transient engine errors must not lose updates from upstream."
  - id: RUL-002
    title: "Query latency p95 ≤ 500ms"
    context: BC-002
    description: "Search that exceeds this budget triggers paging or pre-aggregation."

rules:
  traceability:
    target: "docs/specs/traceability.md"
    include_existing_rows: true
    default_status: Draft

scenarios:
  - id: "SCN-001"
    requirement_id: REQ-001
    use_case: UC-001
    seed: true
    target: "features/search/indexing_a_new_document_makes_it_searchable.feature"
    template: "templates/features/indexing_a_new_document_makes_it_searchable.feature.tpl"
    feature: "Indexing a new document makes it searchable"
    scenario: "Indexing a new document makes it searchable"
    status: "Draft"
  - id: "SCN-002"
    requirement_id: REQ-002
    use_case: UC-002
    seed: true
    target: "features/search/full_text_query_returns_ranked_results.feature"
    template: "templates/features/full_text_query_returns_ranked_results.feature.tpl"
    feature: "Full-text query returns ranked results"
    scenario: "Full-text query returns ranked results"
    status: "Draft"
  - id: "SCN-003"
    requirement_id: REQ-004
    use_case: UC-004
    seed: true
    target: "features/search/reindex_restores_a_corrupted_index.feature"
    template: "templates/features/reindex_restores_a_corrupted_index.feature.tpl"
    feature: "Reindex restores a corrupted index"
    scenario: "Reindex restores a corrupted index"
    status: "Draft"
