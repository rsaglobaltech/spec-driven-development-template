schema_version: "1.3.0"
metadata:
  name: "Reporting Backend Domain Pack"
  version: "0.1.0"
  language: "en"
  project_type: "backend"

variables:
  required:
    - PROJECT_NAME
    - PROJECT_SLUG
    - DOMAIN

requirements:
  - id: REQ-001
    title: "Define a report with parameters, data source, and output format"
    priority: Must
    description: "Reports are first-class artifacts that can be versioned and audited."
    status: Draft
  - id: REQ-002
    title: "Execute a report synchronously for small datasets"
    priority: Must
    description: "Lightweight reports return results within the request lifecycle."
    status: Draft
  - id: REQ-003
    title: "Execute a report asynchronously for large datasets"
    priority: Must
    description: "Long-running reports run as background jobs and notify on completion."
    status: Draft
  - id: REQ-004
    title: "Schedule a report to run periodically"
    priority: Should
    description: "Daily/weekly/monthly reports are produced without manual triggers."
    status: Draft
  - id: REQ-005
    title: "Export report results as CSV, JSON, or PDF"
    priority: Should
    description: "Consumers integrate with downstream tools that expect standard formats."
    status: Draft

bounded_contexts:
  - id: BC-001
    name: ReportDefinition
    type: Core
    responsibility: "Manage report definitions, parameters, and versions"
    aggregates:
      - ReportDefinition
  - id: BC-002
    name: ReportExecution
    type: Core
    responsibility: "Run reports, manage execution state, deliver outputs"
    aggregates:
      - ReportRun
  - id: BC-003
    name: ReportScheduling
    type: Supporting
    responsibility: "Trigger reports on a recurring schedule"
    aggregates:
      - ReportSchedule

use_cases:
  - id: UC-001
    name: Define Report
    actor: Analyst
    requirement: REQ-001
    command: DefineReportCommand
  - id: UC-002
    name: Run Report Synchronously
    actor: User
    requirement: REQ-002
    command: RunReportCommand
  - id: UC-003
    name: Run Report Asynchronously
    actor: User
    requirement: REQ-003
    command: EnqueueReportCommand
  - id: UC-004
    name: Schedule Report
    actor: Admin
    requirement: REQ-004
    command: ScheduleReportCommand
  - id: UC-005
    name: Export Results
    actor: User
    requirement: REQ-005
    command: ExportResultsCommand

commands:
  - id: CMD-001
    name: DefineReportCommand
    use_case: UC-001
  - id: CMD-002
    name: RunReportCommand
    use_case: UC-002
  - id: CMD-003
    name: EnqueueReportCommand
    use_case: UC-003
  - id: CMD-004
    name: ScheduleReportCommand
    use_case: UC-004
  - id: CMD-005
    name: ExportResultsCommand
    use_case: UC-005

aggregates:
  - id: AGG-001
    name: ReportDefinition
    bounded_context: BC-001
    responsibilities:
      - "Report identity, parameter schema, query source, versions"
    commands:
      - DefineReportCommand
    events:
      - ReportDefined
  - id: AGG-002
    name: ReportRun
    bounded_context: BC-002
    responsibilities:
      - "Single execution: status, parameters, output location"
    commands:
      - RunReportCommand
      - EnqueueReportCommand
      - ExportResultsCommand
    events:
      - ReportEnqueued
      - ReportCompleted
      - ReportFailed
      - ResultsExported
  - id: AGG-003
    name: ReportSchedule
    bounded_context: BC-003
    responsibilities:
      - "Cron-like schedule and trigger history"
    commands:
      - ScheduleReportCommand
    events:
      - ScheduleTriggered

events:
  - id: EVT-001
    name: ReportDefined
    aggregate: ReportDefinition
    payload: [reportId: string, name: string, version: int, definedAt: datetime]
  - id: EVT-002
    name: ReportEnqueued
    aggregate: ReportRun
    payload: [runId: string, reportId: string, userId: string, enqueuedAt: datetime]
  - id: EVT-003
    name: ReportCompleted
    aggregate: ReportRun
    payload: [runId: string, rowCount: int, completedAt: datetime, outputUri: string]
  - id: EVT-004
    name: ReportFailed
    aggregate: ReportRun
    payload: [runId: string, failedAt: datetime, reason: string]
  - id: EVT-005
    name: ResultsExported
    aggregate: ReportRun
    payload: [runId: string, format: string, exportedAt: datetime]
  - id: EVT-006
    name: ScheduleTriggered
    aggregate: ReportSchedule
    payload: [scheduleId: string, reportId: string, triggeredAt: datetime]

outputs:
  files:
    - target: "docs/specs/capabilities/reporting.md"
      template: "templates/capability.md.tpl"

business_rules:
  - id: RUL-001
    title: "Report definitions are versioned; existing runs reference the version they used"
    context: BC-001
    description: "Reproducibility requires immutable historical definitions."
  - id: RUL-002
    title: "Sync runs reject datasets exceeding 10,000 rows"
    context: BC-002
    description: "Above this threshold the user is redirected to the async path."

rules:
  traceability:
    target: "docs/specs/traceability.md"
    include_existing_rows: true
    default_status: Draft

scenarios:
  - id: "SCN-001"
    requirement_id: REQ-001
    use_case: UC-001
    seed: true
    target: "features/reporting/a_new_report_is_registered_and_immediately_runnable.feature"
    template: "templates/features/a_new_report_is_registered_and_immediately_runnable.feature.tpl"
    feature: "A new report is registered and immediately runnable"
    scenario: "A new report is registered and immediately runnable"
    status: "Draft"
  - id: "SCN-002"
    requirement_id: REQ-003
    use_case: UC-003
    seed: true
    target: "features/reporting/async_report_completes_and_notifies_the_user.feature"
    template: "templates/features/async_report_completes_and_notifies_the_user.feature.tpl"
    feature: "Async report completes and notifies the user"
    scenario: "Async report completes and notifies the user"
    status: "Draft"
  - id: "SCN-003"
    requirement_id: REQ-004
    use_case: UC-004
    seed: true
    target: "features/reporting/scheduled_reports_trigger_on_their_cadence.feature"
    template: "templates/features/scheduled_reports_trigger_on_their_cadence.feature.tpl"
    feature: "Scheduled reports trigger on their cadence"
    scenario: "Scheduled reports trigger on their cadence"
    status: "Draft"
