schema_version: "1.3.0"
metadata:
  name: "Feature Flags Backend Domain Pack"
  version: "0.1.0"
  language: "en"
  project_type: "backend"

variables:
  required:
    - PROJECT_NAME
    - PROJECT_SLUG
    - DOMAIN

requirements:
  - id: REQ-001
    title: "Define feature flags with identifier, description, and default value"
    priority: Must
    description: "Centralised registry of all feature flags."
    status: Draft
  - id: REQ-002
    title: "Evaluate flag state per user, environment, and rollout percentage"
    priority: Must
    description: "Support gradual rollouts and per-user overrides."
    status: Draft
  - id: REQ-003
    title: "Audit every flag toggle with actor and reason"
    priority: Should
    description: "Operational changes are traceable for incident review."
    status: Draft
  - id: REQ-004
    title: "Emit events when flags transition state"
    priority: Should
    description: "Other services can react to flag changes."
    status: Draft

bounded_contexts:
  - id: BC-001
    name: FlagRegistry
    type: Core
    responsibility: "Flag definitions, defaults, and metadata"
    aggregates: [FeatureFlag]
  - id: BC-002
    name: FlagEvaluation
    type: Core
    responsibility: "Per-request flag state resolution"
    aggregates: [FlagEvaluation]

use_cases:
  - id: UC-001
    name: Define Flag
    actor: Operator
    requirement: REQ-001
    command: DefineFlagCommand
  - id: UC-002
    name: Evaluate Flag
    actor: System
    requirement: REQ-002
    command: EvaluateFlagCommand
  - id: UC-003
    name: Toggle Flag
    actor: Operator
    requirement: REQ-003
    command: ToggleFlagCommand
  - id: UC-004
    name: Publish Flag Change
    actor: System
    requirement: REQ-004
    command: PublishFlagChangeCommand

commands:
  - id: CMD-001
    name: DefineFlagCommand
    use_case: UC-001
  - id: CMD-002
    name: EvaluateFlagCommand
    use_case: UC-002
  - id: CMD-003
    name: ToggleFlagCommand
    use_case: UC-003
  - id: CMD-004
    name: PublishFlagChangeCommand
    use_case: UC-004

aggregates:
  - id: AGG-001
    name: FeatureFlag
    bounded_context: BC-001
    responsibilities: ["Flag definition, current state, rollout rules"]
    commands: [DefineFlagCommand, ToggleFlagCommand, PublishFlagChangeCommand]
    events: [FlagDefined, FlagToggled]
  - id: AGG-002
    name: FlagEvaluation
    bounded_context: BC-002
    responsibilities: ["Cached evaluation result per (flag, user, env)"]
    commands: [EvaluateFlagCommand]
    events: [FlagEvaluated]

events:
  - id: EVT-001
    name: FlagDefined
    aggregate: FeatureFlag
    payload: [flagId: string, name: string, defaultValue: bool, definedAt: datetime]
  - id: EVT-002
    name: FlagToggled
    aggregate: FeatureFlag
    payload: [flagId: string, previousState: bool, newState: bool, actorId: string, toggledAt: datetime, reason: string]
  - id: EVT-003
    name: FlagEvaluated
    aggregate: FlagEvaluation
    payload: [flagId: string, userId: string, env: string, value: bool, evaluatedAt: datetime]

outputs:
  files:
    - target: "docs/specs/capabilities/feature-flags.md"
      template: "templates/capability.md.tpl"

business_rules:
  - id: RUL-001
    title: "Flag identifiers are immutable once published"
    context: BC-001
    description: "Renaming requires a new flag and a migration plan."
  - id: RUL-002
    title: "Toggling a flag requires a non-empty reason"
    context: BC-001
    description: "Audit trail must explain operational changes."

rules:
  traceability:
    target: "docs/specs/traceability.md"
    include_existing_rows: true
    default_status: Draft

scenarios:
  - id: "SCN-001"
    requirement_id: REQ-001
    use_case: UC-001
    seed: true
    target: "features/feature-flags/defining_a_flag_emits_flagdefined.feature"
    template: "templates/features/defining_a_flag_emits_flagdefined.feature.tpl"
    feature: "Defining a flag emits FlagDefined"
    scenario: "Defining a flag emits FlagDefined"
    status: "Draft"
  - id: "SCN-002"
    requirement_id: REQ-002
    use_case: UC-002
    seed: true
    target: "features/feature-flags/evaluation_respects_rollout_percentage.feature"
    template: "templates/features/evaluation_respects_rollout_percentage.feature.tpl"
    feature: "Evaluation respects rollout percentage"
    scenario: "Evaluation respects rollout percentage"
    status: "Draft"
