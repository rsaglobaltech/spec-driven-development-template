schema_version: "1.3.0"
metadata:
  name: "Multi-Tenant Backend Domain Pack"
  version: "0.1.0"
  language: "en"
  project_type: "backend"

variables:
  required:
    - PROJECT_NAME
    - PROJECT_SLUG
    - DOMAIN

requirements:
  - id: REQ-001
    title: "Isolate tenant data so no tenant can read or write another's data"
    priority: Must
    description: "Hard data isolation is the foundational invariant of any multi-tenant system."
    status: Draft
  - id: REQ-002
    title: "Provision a new tenant with default configuration"
    priority: Must
    description: "Onboard a tenant atomically with a unique identifier and defaults."
    status: Draft
  - id: REQ-003
    title: "Enforce per-tenant resource quotas (storage, requests, users)"
    priority: Must
    description: "Prevent any single tenant from exhausting shared capacity."
    status: Draft
  - id: REQ-004
    title: "Deprovision a tenant and purge their data on request"
    priority: Should
    description: "GDPR / data-residency compliance requires verified deletion."
    status: Draft

bounded_contexts:
  - id: BC-001
    name: TenantProvisioning
    type: Core
    responsibility: "Tenant lifecycle: create, suspend, deprovision"
    aggregates:
      - Tenant
  - id: BC-002
    name: TenantIsolation
    type: Core
    responsibility: "Per-request tenant context, row-level scoping, quota enforcement"
    aggregates:
      - TenantContext

use_cases:
  - id: UC-001
    name: Provision Tenant
    actor: Admin
    requirement: REQ-002
    command: ProvisionTenantCommand
  - id: UC-002
    name: Resolve Tenant Context
    actor: System
    requirement: REQ-001
    command: ResolveTenantContextCommand
  - id: UC-003
    name: Enforce Quota
    actor: System
    requirement: REQ-003
    command: EnforceQuotaCommand
  - id: UC-004
    name: Deprovision Tenant
    actor: Admin
    requirement: REQ-004
    command: DeprovisionTenantCommand

commands:
  - id: CMD-001
    name: ProvisionTenantCommand
    use_case: UC-001
  - id: CMD-002
    name: ResolveTenantContextCommand
    use_case: UC-002
  - id: CMD-003
    name: EnforceQuotaCommand
    use_case: UC-003
  - id: CMD-004
    name: DeprovisionTenantCommand
    use_case: UC-004

aggregates:
  - id: AGG-001
    name: Tenant
    bounded_context: BC-001
    responsibilities:
      - "Tenant identity, status, quotas, deletion state"
    commands:
      - ProvisionTenantCommand
      - DeprovisionTenantCommand
    events:
      - TenantProvisioned
      - TenantDeprovisioned
  - id: AGG-002
    name: TenantContext
    bounded_context: BC-002
    responsibilities:
      - "Bound a request to a single tenant for the duration of execution"
    commands:
      - ResolveTenantContextCommand
      - EnforceQuotaCommand
    events:
      - QuotaExceeded

events:
  - id: EVT-001
    name: TenantProvisioned
    aggregate: Tenant
    payload:
      - tenantId: string
      - name: string
      - provisionedAt: datetime
  - id: EVT-002
    name: TenantDeprovisioned
    aggregate: Tenant
    payload:
      - tenantId: string
      - deprovisionedAt: datetime
      - reason: string
  - id: EVT-003
    name: QuotaExceeded
    aggregate: TenantContext
    payload:
      - tenantId: string
      - quotaName: string
      - exceededAt: datetime

outputs:
  files:
    - target: "docs/specs/capabilities/multi-tenant.md"
      template: "templates/capability.md.tpl"

business_rules:
  - id: RUL-001
    title: "Every data access query must include the active tenant id"
    context: BC-002
    description: "ORM-level or repository-level filters enforce this invariant."
  - id: RUL-002
    title: "Deprovisioning is a two-phase commit (soft-delete then purge)"
    context: BC-001
    description: "Hard purge runs only after a 7-day grace window."

rules:
  traceability:
    target: "docs/specs/traceability.md"
    include_existing_rows: true
    default_status: Draft

scenarios:
  - id: "SCN-001"
    requirement_id: REQ-002
    use_case: UC-001
    seed: true
    target: "features/multi-tenant/provisioning_a_tenant_emits_tenantprovisioned.feature"
    template: "templates/features/provisioning_a_tenant_emits_tenantprovisioned.feature.tpl"
    feature: "Provisioning a tenant emits TenantProvisioned"
    scenario: "Provisioning a tenant emits TenantProvisioned"
    status: "Draft"
  - id: "SCN-002"
    requirement_id: REQ-001
    use_case: UC-002
    seed: true
    target: "features/multi-tenant/cross_tenant_read_attempts_are_rejected.feature"
    template: "templates/features/cross_tenant_read_attempts_are_rejected.feature.tpl"
    feature: "Cross-tenant read attempts are rejected"
    scenario: "Cross-tenant read attempts are rejected"
    status: "Draft"
  - id: "SCN-003"
    requirement_id: REQ-003
    use_case: UC-003
    seed: true
    target: "features/multi-tenant/exceeding_a_quota_emits_quotaexceeded.feature"
    template: "templates/features/exceeding_a_quota_emits_quotaexceeded.feature.tpl"
    feature: "Exceeding a quota emits QuotaExceeded"
    scenario: "Exceeding a quota emits QuotaExceeded"
    status: "Draft"
