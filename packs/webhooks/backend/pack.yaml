schema_version: "1.3.0"
metadata:
  name: "Webhooks Backend Domain Pack"
  version: "0.1.0"
  language: "en"
  project_type: "backend"

variables:
  required:
    - PROJECT_NAME
    - PROJECT_SLUG
    - DOMAIN

requirements:
  - id: REQ-001
    title: "Subscribe an endpoint to one or more event types"
    priority: Must
    description: "Consumers register a callback URL plus an interesting-events filter."
    status: Draft
  - id: REQ-002
    title: "Deliver outgoing events to subscribed endpoints with HMAC signatures"
    priority: Must
    description: "Delivered payloads carry a verifiable signature so consumers can trust them."
    status: Draft
  - id: REQ-003
    title: "Retry failed deliveries with exponential backoff"
    priority: Must
    description: "Network or downstream failures must not silently drop events."
    status: Draft
  - id: REQ-004
    title: "Mark a subscription as failing and pause deliveries after repeated failures"
    priority: Should
    description: "Stop wasting capacity on permanently-broken consumers."
    status: Draft
  - id: REQ-005
    title: "Provide a delivery log queryable by subscription and event id"
    priority: Should
    description: "Consumers need to audit what arrived and what didn't."
    status: Draft

bounded_contexts:
  - id: BC-001
    name: SubscriptionManagement
    type: Core
    responsibility: "Subscriptions, event filters, HMAC secrets, pause state"
    aggregates:
      - Subscription
  - id: BC-002
    name: DeliveryEngine
    type: Core
    responsibility: "Outbound HTTP delivery, retries, signature generation"
    aggregates:
      - DeliveryAttempt

use_cases:
  - id: UC-001
    name: Create Subscription
    actor: Consumer
    requirement: REQ-001
    command: CreateSubscriptionCommand
  - id: UC-002
    name: Dispatch Event
    actor: System
    requirement: REQ-002
    command: DispatchEventCommand
  - id: UC-003
    name: Retry Failed Delivery
    actor: System
    requirement: REQ-003
    command: RetryDeliveryCommand
  - id: UC-004
    name: Pause Failing Subscription
    actor: System
    requirement: REQ-004
    command: PauseSubscriptionCommand
  - id: UC-005
    name: Query Delivery Log
    actor: Consumer
    requirement: REQ-005
    command: QueryDeliveryLogCommand

commands:
  - id: CMD-001
    name: CreateSubscriptionCommand
    use_case: UC-001
  - id: CMD-002
    name: DispatchEventCommand
    use_case: UC-002
  - id: CMD-003
    name: RetryDeliveryCommand
    use_case: UC-003
  - id: CMD-004
    name: PauseSubscriptionCommand
    use_case: UC-004
  - id: CMD-005
    name: QueryDeliveryLogCommand
    use_case: UC-005

aggregates:
  - id: AGG-001
    name: Subscription
    bounded_context: BC-001
    responsibilities:
      - "Endpoint URL, event filter, secret, pause state, failure counter"
    commands:
      - CreateSubscriptionCommand
      - PauseSubscriptionCommand
    events:
      - SubscriptionCreated
      - SubscriptionPaused
  - id: AGG-002
    name: DeliveryAttempt
    bounded_context: BC-002
    responsibilities:
      - "Single delivery: target URL, request, response, retry count"
    commands:
      - DispatchEventCommand
      - RetryDeliveryCommand
      - QueryDeliveryLogCommand
    events:
      - DeliverySucceeded
      - DeliveryFailed

events:
  - id: EVT-001
    name: SubscriptionCreated
    aggregate: Subscription
    payload: [subscriptionId: string, consumerId: string, eventTypes: array, targetUrl: string, createdAt: datetime]
  - id: EVT-002
    name: SubscriptionPaused
    aggregate: Subscription
    payload: [subscriptionId: string, pausedAt: datetime, reason: string]
  - id: EVT-003
    name: DeliverySucceeded
    aggregate: DeliveryAttempt
    payload: [deliveryId: string, subscriptionId: string, eventId: string, attempts: int, succeededAt: datetime]
  - id: EVT-004
    name: DeliveryFailed
    aggregate: DeliveryAttempt
    payload: [deliveryId: string, subscriptionId: string, eventId: string, attempts: int, failedAt: datetime, reason: string]

outputs:
  files:
    - target: "docs/specs/capabilities/webhooks.md"
      template: "templates/capability.md.tpl"

business_rules:
  - id: RUL-001
    title: "Outgoing payloads carry an HMAC-SHA256 signature header"
    context: BC-002
    description: "Consumers can verify origin without TLS-level checks."
  - id: RUL-002
    title: "Retry sequence is 1m, 5m, 30m, 2h, 12h; after 5 failures the subscription is paused"
    context: BC-002
    description: "Bounded retry budget protects sender capacity."
  - id: RUL-003
    title: "Delivery log is retained for 30 days"
    context: BC-002
    description: "Balances diagnostic value against storage cost."

rules:
  traceability:
    target: "docs/specs/traceability.md"
    include_existing_rows: true
    default_status: Draft

scenarios:
  - id: "SCN-001"
    requirement_id: REQ-001
    use_case: UC-001
    seed: true
    target: "features/webhooks/creating_a_subscription_emits_subscriptioncreated.feature"
    template: "templates/features/creating_a_subscription_emits_subscriptioncreated.feature.tpl"
    feature: "Creating a subscription emits SubscriptionCreated"
    scenario: "Creating a subscription emits SubscriptionCreated"
    status: "Draft"
  - id: "SCN-002"
    requirement_id: REQ-002
    use_case: UC-002
    seed: true
    target: "features/webhooks/successful_delivery_emits_deliverysucceeded_with_hmac_verifi.feature"
    template: "templates/features/successful_delivery_emits_deliverysucceeded_with_hmac_verifi.feature.tpl"
    feature: "Successful delivery emits DeliverySucceeded with HMAC verified"
    scenario: "Successful delivery emits DeliverySucceeded with HMAC verified"
    status: "Draft"
  - id: "SCN-003"
    requirement_id: REQ-004
    use_case: UC-004
    seed: true
    target: "features/webhooks/after_5_failed_retries_the_subscription_is_paused.feature"
    template: "templates/features/after_5_failed_retries_the_subscription_is_paused.feature.tpl"
    feature: "After 5 failed retries the subscription is paused"
    scenario: "After 5 failed retries the subscription is paused"
    status: "Draft"
